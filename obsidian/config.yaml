name: Obsidian
version: "0.61"
slug: ha-obsidian
description: Runs Obsidian within your Home Assistant setup providing integration of live-features
url: https://github.com/crazyrokr/hassio-addons/tree/main/obsidian
webui: http://[HOST]:[PORT:3000]
panel_icon: "mdi:note-edit"
arch:
  - aarch64
  - amd64
init: false
tmpfs: true
map:
  - type: addon_config
    read_only: False
    path: /config
  - type: share
    read_only: False
    path: /share
environment:
  PUID: "1000"
  PGID: "1000"
  START_DOCKER: "false"
  TITLE: "Obsidian"
  NO_GAMEPAD: "true"
  DISABLE_DRI3: "true"
  HARDEN_DESKTOP: "true"
  HARDEN_OPENBOX: "true"
  NO_DECOR: "true"
  SELKIES_UI_SHOW_SIDEBAR: "false"
  SELKIES_FRAMERATE: "15"
  SELKIES_MANUAL_WIDTH: "1280"
  SELKIES_MANUAL_HEIGHT: "720"
  SELKIES_IS_MANUAL_RESOLUTION_MODE: "true"
  SELKIES_ENCODER: "x264enc"
  SELKIES_USE_CPU: "true"
ingress: true
ingress_port: 3000
ports:
  3000/tcp: 3000
  3001/tcp: 3001
  8082/tcp: 8082
