name: Obsidian
version: "0.63"
slug: ha-obsidian
description: Runs Obsidian within your Home Assistant setup providing integration of live-features
url: https://github.com/crazyrokr/hassio-addons/tree/main/obsidian
webui: http://[HOST]:[PORT:3000]
panel_icon: "mdi:note-edit"
arch:
  - aarch64
  - amd64
init: false
tmpfs: true
map:
  - type: addon_config
    read_only: False
    path: /config
  - type: share
    read_only: False
    path: /share
environment:
  PUID: "1000"
  PGID: "1000"
  START_DOCKER: "false"
  TITLE: "Obsidian"
  NO_GAMEPAD: "true"
  DISABLE_DRI3: "true"
  HARDEN_DESKTOP: "true"
  HARDEN_OPENBOX: "true"
  NO_DECOR: "true"

  # --- Rendering Speed Optimizations ---
  # Lowering the damage duration makes the server send updates faster when Obsidian is busy rendering
  SELKIES_DAMAGE_DUR: "10"
  # Reducing paint-over trigger helps show the "in-progress" render more quickly
  SELKIES_PAINT_OVER_TRIGGER: "5"
  # Using H264 mode can sometimes handle the "busy" pixels of a complex render better than JPEG
  SELKIES_H264_STREAMING_MODE: "true"
  
  # --- Smooth Scrolling Optimizations ---
  # Higher stripes (4-8) help the CPU process scrolling motion faster
  SELKIES_STRIPES: "4"
  # Reducing the "Damage Threshold" makes the streamer react faster to small scroll movements
  SELKIES_DAMAGE_THRESHOLD: "5"
  # Lowering Paint-Over trigger ensures the "sharp" frame doesn't interrupt a long scroll
  SELKIES_PAINT_OVER_TRIGGER: "10"
  
  # --- Sharper Image Settings ---
  SELKIES_UI_SHOW_SIDEBAR: "false"
  SELKIES_FRAMERATE: "20"
  SELKIES_MANUAL_WIDTH: "1920"
  SELKIES_MANUAL_HEIGHT: "1080"
  SELKIES_IS_MANUAL_RESOLUTION_MODE: "true"
  
  # Increasing DPI makes icons/text smaller and sharper (96 is default, 120 is crisper)
  SELKIES_SCALING_DPI: "96" 
  
  # JPEG Quality: 40 is blurry, 75-80 is the sweet spot for sharpness vs speed
  SELKIES_JPEG_QUALITY: "80"
  
  # Enable high-quality paint-over (sharpens the image once you stop moving the mouse)
  SELKIES_USE_PAINT_OVER_QUALITY: "true"
  SELKIES_PAINT_OVER_JPEG_QUALITY: "100"

ingress: true
ingress_port: 3000
ports:
  3000/tcp: 3000
  3001/tcp: 3001
  8082/tcp: 8082
